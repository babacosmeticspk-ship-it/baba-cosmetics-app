plugins {
    id 'com.android.application'
}

android {
    namespace 'com.babacosmetics.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.babacosmetics.app"
        minSdk 23          // Android 6.0 and newer
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
